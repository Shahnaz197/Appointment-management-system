<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Appointment System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-container">
    <h1>MEDIBOOK</h1>
    <p>Hospital Appointment System</p>

    <!-- tabs -->
    <div class="tabs">
        <div class="tab active" onclick="showTab('login')">LOGIN</div>
        <div class="tab" onclick="showTab('register')">REGISTER</div>
    </div>

    <!-- alert -->
    <div class="alert alert-error" id="alert"></div>
    <div class="alert alert-success" id="successAlert"></div>

    <!-- login form -->
    <div id="loginForm" class="card">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="login()" style="width:100%">
            LOGIN
        </button>
    </div>

    <!-- register form -->
    <div id="registerForm" class="card" style="display:none">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="your@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="••••••••">
        </div>
        <div class="form-group">
            <label>Role</label>
            <select id="registerRole">
                <option value="PATIENT">Patient</option>
                <option value="DOCTOR">Doctor</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="register()" style="width:100%">
            REGISTER
        </button>
    </div>
</div>

<script>
    // check if already logged in
    if (localStorage.getItem('token')) {
        window.location.href = 'dashboard.html';
    }

    function showTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        if (tab === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }
    }

    function showError(message) {
        const alert = document.getElementById('alert');
        alert.textContent = message;
        alert.style.display = 'block';
        setTimeout(() => alert.style.display = 'none', 3000);
    }

    function showSuccess(message) {
        const alert = document.getElementById('successAlert');
        alert.textContent = message;
        alert.style.display = 'block';
        setTimeout(() => alert.style.display = 'none', 3000);
    }

    async function login() {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
            showError('Please fill in all fields');
            return;
        }

        try {
            const response = await fetch(
                `/api/auth/login?email=${email}&password=${password}`,
                { method: 'POST' }
            );

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('email', data.email);
                localStorage.setItem('role', data.role);
                window.location.href = 'dashboard.html';
            } else {
                showError(data.message || 'Login failed');
            }
        } catch (error) {
            showError('Something went wrong!');
        }
    }

    async function register() {
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        const role = document.getElementById('registerRole').value;

        if (!email || !password) {
            showError('Please fill in all fields');
            return;
        }

        try {
            const response = await fetch(
                `/api/auth/register?email=${email}&password=${password}&role=${role}`,
                { method: 'POST' }
            );

            const data = await response.json();

            if (response.ok) {
                showSuccess('Registered successfully! Please login.');
                setTimeout(() => showTab('login'), 1500);
            } else {
                showError(data.message || 'Registration failed');
            }
        } catch (error) {
            showError('Something went wrong!');
        }
    }
</script>

</body>
</html>
